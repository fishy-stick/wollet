services:
  wollet:
    build:
      context: .
    network_mode: host
    user: "${WOLLET_UID:-1000}:${WOLLET_GID:-1000}"
    env_file:
      - .env
    environment:
      WOLLET_DB_PATH: /data/wollet.db
    volumes:
      - ./data:/data
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 15s
