name: CI

on:
  pull_request:
  push:
    branches:
      - "**"
  workflow_call:

permissions:
  contents: read

defaults:
  run:
    shell: pwsh

jobs:
  go-test:
    name: Go tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Test
        run: go test ./...

      - name: Test with race detector
        env:
          CGO_ENABLED: "1"
        run: go test -race ./...

  go-vet:
    name: Go vet
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...

  web-test:
    name: Web tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Test
        run: node --test internal/webui/tests/*.test.cjs

  dotnet-test:
    name: .NET ${{ matrix.suite }} tests
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        suite: [Core, Windows]
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      TEST_PROJECT: clients/windows/Wollet.Client.${{ matrix.suite }}.Tests/Wollet.Client.${{ matrix.suite }}.Tests.csproj
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore $env:TEST_PROJECT

      - name: Test
        run: dotnet test --project $env:TEST_PROJECT --configuration Release --no-restore
